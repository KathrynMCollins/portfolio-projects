name: doc-impact

on:
  push:
    paths: ["projects/doc-impact-cli/**"]
  pull_request:
    paths: ["projects/doc-impact-cli/**"]
  # The audit job runs only when someone with write access starts it by hand.
  workflow_dispatch:
    inputs:
      effort:
        description: "Reasoning effort"
        default: medium
        type: choice
        options: [low, medium, high]

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/doc-impact-cli

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q

  audit-sample:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run the audit on the sample product
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >
          doc-impact
          --changes examples/lanternfish/CHANGELOG-2.4.md
          --docs examples/lanternfish/docs
          --effort ${{ inputs.effort }}
          --out report.md --json findings.json
      - run: cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: doc-impact-sample-report
          path: |
            projects/doc-impact-cli/report.md
            projects/doc-impact-cli/findings.json
