[project]
name = "doc-impact"
version = "0.1.0"
description = "Find the documentation a set of product changes makes stale, using the Claude API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.10", "pydantic>=2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
doc-impact = "doc_impact.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["doc_impact"]
