title: "Kathryn Collins"
tagline: Documentation leadership and technical editing
description: Case studies, samples, a talk and a pre-registered model test from running a documentation program. Two reading paths, one for documentation leadership and one for technical editing.
url: https://kathrynmcollins.github.io
repository_url: https://github.com/KathrynMCollins/portfolio-projects
plugins:
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: false
readme_index:
  enabled: true
  remove_originals: false
titles_from_headings:
  enabled: true
  strip_title: false
kramdown:
  auto_ids: true
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "README.md"
    values:
      layout: home
