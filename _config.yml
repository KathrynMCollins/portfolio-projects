title: "Kathryn Collins"
tagline: Content operations, knowledge management and documentation leadership
description: Case studies, decision memos and samples from running a documentation and knowledge program, covering capacity planning, information architecture, content migration, governance and review.
url: https://kathrynmcollins.github.io
repository_url: https://github.com/KathrynMCollins/portfolio-projects
plugins:
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: false
readme_index:
  enabled: true
  remove_originals: false
titles_from_headings:
  enabled: true
  strip_title: false
kramdown:
  auto_ids: true
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "README.md"
    values:
      layout: home
